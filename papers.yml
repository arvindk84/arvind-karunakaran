# =============================================================================
# papers.yml: single source of truth for the publications list on research.html.
#
# scripts/build_site.py renders this file into research.html between
# <!-- PUBS:START --> and <!-- PUBS:END -->. To add a paper, add one entry here
# (or run `python scripts/add_paper.py ...`), then run `python scripts/build_site.py`.
# Do NOT edit the publications HTML directly. Keep this list in sync with the
# "Publications" section of the CV (files/cv/cv.pdf).
#
# Fields:
#   title    (required)  Paper title, no trailing period.
#   author   (required)  Full author string. "Karunakaran, A." is auto-bolded.
#   year     (required)  Publication year (integer). Used for sorting.
#   venue    (required)  Journal or book title (rendered in italics).
#   volume / issue / pages   (optional) Bibliographic detail.
#   doi      (optional)  Bare DOI, e.g. 10.1177/00018392241256303 (no URL).
#   pdf      (optional)  Filename in files/papers/ (shows a PDF button).
#   equal    (optional)  true -> shows an "Equal contribution" chip.
#   status   (optional)  e.g. "Forthcoming"; shown instead of the year and sorted first.
#   note     (optional)  One line shown under the entry.
#   type     (required)  "Journal Article" | "Book Chapter" | "Working Paper".
#   categories (required) List (usually [<type>]).
#   date     (required)  YYYY-MM-DD, orders entries within a year (newest first).
# =============================================================================

